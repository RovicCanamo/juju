<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Scale a Recipe</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f8f8f8; }
        h1, h2 { margin-bottom: 10px; }
        textarea, input, button, select {
            display: block; width: 100%; margin-bottom: 15px; padding: 10px;
        }
        .form-section {
            background: white; padding: 20px; margin-bottom: 30px; border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .button {
            background-color: #007BFF; color: white; border: none; cursor: pointer;
        }
        .button:hover { background-color: #0056b3; }
        ul { list-style: none; padding-left: 0; }
    </style>
</head>
<body>

<h1>Scale a Recipe</h1>

<form method="POST" action="{% url 'parse_ingredients' %}">
    {% csrf_token %}
    <div class="form-section">
        <label>Paste Ingredients</label>
        <textarea name="ingredients" rows="6" placeholder="e.g. 1 cup flour&#10;2 tbsp sugar" required></textarea>

        <label>Recipe Name</label>
        <input type="text" name="recipe_name" placeholder="e.g. Pancakes" required>

        <label>Original Servings</label>
        <input type="number" name="original_servings" min="1" step="any" placeholder="e.g. 4" required>

        <label>Desired Servings</label>
        <input type="number" name="desired_servings" min="1" step="any" placeholder="e.g. 6" required>

        <button class="button" type="submit">Parse and Scale</button>
    </div>
</form>

{% if parsed_ingredients %}
<div class="form-section">
    <h2>Parsed Ingredients</h2>
    <form method="POST" action="{% url 'save_scaled_recipe' %}">
        {% csrf_token %}
        <input type="hidden" name="recipe_name" value="{{ recipe_name }}">
        <input type="hidden" name="original_servings" value="{{ original_servings }}">
        <input type="hidden" name="desired_servings" value="{{ desired_servings }}">

        <ul>
            {% for ing in parsed_ingredients %}
                <li>
                    <input name="ingredient_name_{{ forloop.counter }}" value="{{ ing.name }}" required>
                    <input name="ingredient_quantity_{{ forloop.counter }}" value="{{ ing.quantity }}" required>
                    <input name="ingredient_unit_{{ forloop.counter }}" value="{{ ing.unit }}">
                </li>
            {% endfor %}
        </ul>

        <input type="hidden" name="ingredient_count" value="{{ parsed_ingredients|length }}">
        <button class="button" type="submit">Save Recipe</button>
    </form>
</div>
{% endif %}

</body>
</html>
