<!DOCTYPE html>
<html>
<head>
    <title>Paste Ingredients</title>
</head>
<body>
    <h1>Paste Your Recipe Ingredients</h1>
    <form method="post">
        {% csrf_token %}
        <textarea name="ingredients" rows="15" cols="60" placeholder="e.g.&#10;1/2 cup flour&#10;2 tbsp sugar&#10;300 g beef"></textarea>
        <br><br>
        <button type="submit">Parse Ingredients</button>
    </form>

    {% if parsed_ingredients %}
        <h2>Parsed Ingredients</h2>
        <ul>
            {% for ing in parsed_ingredients %}
                <li>{{ ing.quantity }} {{ ing.unit }} {{ ing.name }}</li>
            {% endfor %}
        </ul>
    {% endif %}
</body>
</html>
