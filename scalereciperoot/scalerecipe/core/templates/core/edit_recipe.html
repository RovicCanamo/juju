<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Recipe</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f9f9f9;
            margin: 40px;
        }

        .banner {
            background-color: #eef;
            padding: 10px 20px;
            margin-bottom: 20px;
            border-left: 5px solid #88f;
            font-weight: bold;
        }

        form {
            background: white;
            padding: 20px;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        label {
            display: block;
            margin: 12px 0 5px;
        }

        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 8px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .btn {
            background-color: #007BFF;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
        }

        .btn:hover {
            background-color: #0056b3;
        }

        .ingredient-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .ingredient-table th, .ingredient-table td {
            padding: 8px;
            text-align: left;
        }

        .ingredient-table input {
            width: 100%;
        }

        .top-buttons {
            margin-bottom: 15px;
        }

        .delete-btn {
            background: none;
            border: none;
            color: red;
            font-size: 1.2em;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="banner">
    This recipe was originally meant for {{ recipe.original_servings }} servings.
</div>

<h2>Edit Recipe: {{ recipe.name }}</h2>

<form method="post">
    {% csrf_token %}

    <label for="recipe_name">Recipe Name:</label>
    <input type="text" name="recipe_name" value="{{ recipe.name }}">

    <label for="original_servings">Original Servings:</label>
    <input type="number" name="original_servings" value="{{ recipe.original_servings }}">

    <label for="desired_servings">Desired Servings:</label>
    <input type="number" name="desired_servings" value="{{ recipe.servings }}">

    <div class="top-buttons">
        <button type="button" class="btn" onclick="toggleFractions()">Toggle Fractions</button>
        <button type="submit" name="action" value="revert" class="btn">Revert to Original</button>
    </div>

    <table class="ingredient-table" id="ingredient-table">
        <thead>
            <tr>
                <th>Ingredient</th>
                <th>Quantity</th>
                <th>Unit</th>
                <th>Notes</th>
                <th>🗑</th>
            </tr>
        </thead>
        <tbody>
            {% for ing in parsed_ingredients %}
            <tr>
                <td><input type="text" name="name_{{ forloop.counter0 }}" value="{{ ing.name }}"></td>
                <td><input type="text" class="quantity" name="quantity_{{ forloop.counter0 }}" value="{{ ing.quantity }}"></td>
                <td><input type="text" name="unit_{{ forloop.counter0 }}" value="{{ ing.unit }}"></td>
                <td><input type="text" name="note_{{ forloop.counter0 }}" value="{{ ing.note }}"></td>
                <td><button type="button" class="delete-btn" onclick="deleteRow(this)">🗑</button></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <button type="button" class="btn" onclick="addIngredient()">➕ Add Ingredient</button>
    <button type="submit" class="btn">Save Changes</button>
</form>

<script>
    let isFraction = false;

    function gcd(a, b) {
        return b ? gcd(b, a % b) : a;
    }

    let isFraction = false;

    function parseFraction(val) {
        if (val.includes(" ")) {
            const [whole, frac] = val.split(" ");
            const [numerator, denominator] = frac.split("/");
            return parseInt(whole) + parseInt(numerator) / parseInt(denominator);
        } else if (val.includes("/")) {
            const [numerator, denominator] = val.split("/");
            return parseInt(numerator) / parseInt(denominator);
        } else {
            return parseFloat(val);
        }
    }

    function decimalToFraction(decimal) {
        const tolerance = 1.0E-4;
        let h1 = 1, h2 = 0, k1 = 0, k2 = 1;
        let b = decimal;

        while (Math.abs(decimal - h1 / k1) > decimal * tolerance) {
            let a = Math.floor(b);
            let aux = h1; h1 = a * h1 + h2; h2 = aux;
            aux = k1; k1 = a * k1 + k2; k2 = aux;
            b = 1 / (b - a);
            if (!isFinite(b)) break;
        }

        const whole = Math.floor(h1 / k1);
        const remainder = h1 % k1;

        if (remainder === 0) return `${whole}`;
        if (whole === 0) return `${remainder}/${k1}`;
        return `${whole} ${remainder}/${k1}`;
    }

    function toggleFractions() {
        const qtyInputs = document.querySelectorAll(".quantity");
        qtyInputs.forEach(input => {
            const val = input.value.trim();
            if (!val) return;

            if (!isFraction) {
                const floatVal = parseFraction(val);
                if (!isNaN(floatVal)) {
                    input.dataset.decimal = floatVal;
                    input.value = decimalToFraction(floatVal);
                }
            } else {
                const original = input.dataset.decimal;
                if (original) input.value = parseFloat(original).toFixed(2);
            }
        });

        isFraction = !isFraction;
    }

    function addIngredient() {
        const tbody = document.querySelector("#ingredient-table tbody");
        const row = document.createElement("tr");

        row.innerHTML = `
            <td><input type="text" name="name_0"></td>
            <td><input type="text" class="quantity" name="quantity_0"></td>
            <td><input type="text" name="unit_0"></td>
            <td><input type="text" name="notes_0"></td>
            <td><button type="button" class="delete-btn" onclick="deleteRow(this)">🗑</button></td>
        `;

        tbody.appendChild(row);
        reindexIngredientFields();
    }

    function deleteRow(button) {
        const row = button.closest('tr');
        row.remove();
        reindexIngredientFields();
    }

    function reindexIngredientFields() {
        const rows = document.querySelectorAll("#ingredient-table tbody tr");
        rows.forEach((row, index) => {
            row.querySelectorAll("input").forEach(input => {
                if (input.name.includes("name_")) input.name = `name_${index}`;
                if (input.name.includes("quantity_")) input.name = `quantity_${index}`;
                if (input.name.includes("unit_")) input.name = `unit_${index}`;
                if (input.name.includes("notes_")) input.name = `notes_${index}`;
            });
        });
    }
</script>

</body>
</html>
